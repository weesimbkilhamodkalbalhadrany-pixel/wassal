<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>مطعم العم طه | التوصيل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* ===== إعدادات أساسية ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f8f6f4; color: #1e1817; direction: rtl; padding-bottom: 90px; }
        :root { 
            --primary: #6f1a2d; 
            --gold: #dab669;   
            --light-grey: #f2f2f2;
        }
        
        /* ===== الهيدر ===== */
        .header { position: relative; background: #5b1416; box-shadow: 0 6px 16px rgba(0,0,0,0.25); overflow: hidden; }
        .header-logo-img { width: 100%; display: block; object-fit: cover; max-height: 220px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 18px; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 100%); pointer-events: none; }
        .header-top { position: absolute; top: 0; left: 0; right: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 18px; z-index: 5; }
        .header-icon-left, .header-icon-right { color: var(--gold); font-size: 1.4rem; cursor: pointer; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }

        /* ===== شريط البحث ===== */
        .search-wrapper { padding: 0 16px; margin-top: -18px; position: relative; z-index: 10; }
        .search-container { background: #ffffff; border-radius: 30px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.04); }
        .search-container input { border: none; background: transparent; flex: 1; padding: 4px; font-size: 0.9rem; color: #333; text-align: right; outline: none; }
        .search-container input::placeholder { color: #999; font-weight: 500; }
        .search-icon { color: var(--gold); font-size: 1.1rem; margin-right: 8px; }

        /* ===== حاوية التطبيق ===== */
        .container { padding: 16px 14px 80px; max-width: 600px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.3s ease-out; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== بطاقات الأقسام ===== */
        .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
        .category-card { background: linear-gradient(155deg, var(--primary), #4a0f1c); border-radius: 18px; padding: 20px 12px; text-align: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px rgba(111, 26, 45, 0.25); min-height: 140px; position: relative; border: 1px solid rgba(218, 182, 105, 0.2); }
        .category-card:active { transform: scale(0.97); }
        .category-title { color: var(--gold); font-weight: 800; font-size: 1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .category-img { font-size: 2.6rem; line-height: 1; margin: 4px 0; }
        .order-btn { border: 1.5px solid var(--gold); background: transparent; border-radius: 30px; padding: 5px 20px; color: var(--gold); font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
        .category-card:hover .order-btn { background: var(--gold); color: var(--primary); }

        /* ===== القائمة الداخلية ===== */
        .back-btn { display: inline-flex; align-items: center; gap: 8px; background: #fff; padding: 8px 18px; border-radius: 30px; margin-bottom: 14px; cursor: pointer; font-size: 0.85rem; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eee; color: var(--primary); }
        .menu-list { display: flex; flex-direction: column; gap: 12px; }
        .menu-item-row { background: #fff; border-radius: 16px; border: 1px solid #eee; display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: transform 0.1s; }
        .menu-item-row:active { background: #fbf9f7; transform: scale(0.99); }
        .menu-item-icon { width: 55px; height: 55px; min-width: 55px; border-radius: 14px; background: #f8f6f4; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; overflow: hidden; }
        .menu-item-info { flex: 1; text-align: right; min-width: 0; }
        .menu-item-name { font-weight: 800; font-size: 0.9rem; color: #222; line-height: 1.3; }
        .menu-item-desc { font-size: 0.72rem; color: #888; line-height: 1.4; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-item-price { color: var(--primary); font-weight: 800; font-size: 0.85rem; margin-top: 4px; }
        .menu-item-add-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: var(--gold); border: none; font-size: 1.3rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 6px rgba(111,26,45,0.3); }
        .menu-item-add-btn:active { transform: scale(0.9); }

        /* ===== شريط التنقل السفلي ===== */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; padding: 8px 0 16px; border-top: 1px solid rgba(0,0,0,0.06); box-shadow: 0 -4px 15px rgba(0,0,0,0.04); z-index: 100; }
        .nav-item { text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #888; font-size: 0.65rem; font-weight: 600; padding: 4px 10px; min-width: 50px; position: relative; transition: color 0.2s; }
        .nav-item .nav-icon { font-size: 1.4rem; margin-bottom: 3px; color: #888; transition: color 0.2s; }
        .nav-item.active .nav-icon, .nav-item.active { color: var(--primary); font-weight: 800; }
        .nav-badge { position: absolute; top: 0; right: 8px; background: #ef4444; color: white; font-size: 0.55rem; padding: 2px 6px; border-radius: 50%; border: 2px solid white; font-weight: 800; }

        /* ===== السلة العائمة والجانبية ===== */
        .float-cart { position: fixed; bottom: 85px; left: 16px; right: 16px; background: var(--primary); color: white; padding: 14px 22px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; z-index: 100; display: none; box-shadow: 0 6px 20px rgba(111, 26, 45, 0.4); border: 1.5px solid var(--gold); font-weight: 800; font-size: 0.9rem; cursor: pointer; }
        .cart-sidebar { position: fixed; top: 0; left: -100%; width: 85%; max-width: 380px; height: 100%; background: #ffffff; z-index: 10001; transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; box-shadow: -5px 0 25px rgba(0,0,0,0.15); }
        .cart-sidebar.open { left: 0; }
        .cart-header { padding: 18px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.05rem; }
        .cart-close { cursor: pointer; font-size: 1.3rem; }
        .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
        .cart-item { display: flex; gap: 12px; padding: 12px; background: #f8f6f4; border-radius: 16px; margin-bottom: 12px; align-items: center; border: 1px solid #eaeaea; }
        .cart-item-details { flex: 1; }
        .cart-item-details h4 { font-size: 0.9rem; font-weight: 800; color: #222; }
        .cart-item-details div { font-size: 0.78rem; color: var(--primary); font-weight: 700; margin-top: 3px; }
        .cart-qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn-small { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); border: none; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .cart-footer { padding: 16px; border-top: 1px solid #eee; background: #fff; }
        .cart-total { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 14px; font-size: 1rem; color: #222; }
        .checkout-btn { width: 100%; padding: 14px; background: var(--gold); color: #222; border: none; border-radius: 40px; font-weight: 800; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(218, 182, 105, 0.3); transition: opacity 0.2s; }
        .checkout-btn:active { opacity: 0.9; transform: scale(0.99); }
        
        /* ===== النوافذ المنبثقة (Modals) ===== */
        .item-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); backdrop-filter: blur(5px); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .item-modal-card { background: #fff; border-radius: 24px; width: 100%; max-width: 400px; overflow: hidden; animation: modalPop 0.25s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
        @keyframes modalPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-content { padding: 20px; }
        .modal-content h3 { font-size: 1.25rem; margin-bottom: 6px; color: #222; font-weight: 800; }
        .modal-desc { font-size: 0.82rem; color: #777; margin-bottom: 12px; line-height: 1.4; }
        .modal-price { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-bottom: 16px; }
        .modal-quantity { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 16px; background: #f8f6f4; padding: 10px; border-radius: 40px; }
        .modal-quantity button { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 1.2rem; font-weight: 800; cursor: pointer; }
        .modal-note textarea { width: 100%; padding: 12px; border-radius: 16px; border: 1px solid #ddd; font-size: 0.85rem; resize: none; outline: none; background: #fcfbfa; }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions button { flex: 1; padding: 14px; border-radius: 40px; font-weight: 800; border: none; cursor: pointer; font-size: 0.95rem; }
        .btn-add-modal { background: var(--gold); color: #222; box-shadow: 0 4px 12px rgba(218,182,105,0.3); }
        .btn-close-modal { background: #eee; color: #444; }

        /* ===== Toast Notification ===== */
        .toast { position: fixed; bottom: 95px; left: 20px; right: 20px; background: #222; color: white; padding: 14px; border-radius: 30px; text-align: center; z-index: 9999; display: none; font-size: 0.9rem; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
        .toast.show { display: block; animation: slideUp 0.3s forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== تسجيل الدخول ===== */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 32px; padding: 36px 24px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15); text-align: center; color: white; }
        .role-btn { flex: 1; padding: 12px; border-radius: 40px; font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: all 0.3s; background: transparent; color: rgba(255,255,255,0.7); }
        .role-btn.active { background: #fff; color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        #loginBtn { width: 100%; margin-top: 20px; padding: 15px; border-radius: 40px; border: none; background: var(--gold); color: #222; font-weight: 800; font-size: 1.05rem; cursor: pointer; box-shadow: 0 6px 16px rgba(218,182,105,0.4); }
        .field-input { width: 100%; padding: 15px 20px; border-radius: 40px; border: none; background: rgba(255,255,255,0.15); color: white; font-size: 0.9rem; outline: none; margin-bottom: 14px; text-align: right; }
        .field-input::placeholder { color: rgba(255,255,255,0.6); }

        /* خريطة التوصيل */
        #map-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100000; display: none; flex-direction: column; }
        #map { flex: 1; width: 100%; height: 100%; }
        .map-controls { display: flex; background: var(--primary); padding: 15px; gap: 12px; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="header-top">
            <div class="header-icon-left"><i class="fas fa-utensils"></i></div>
            <div class="header-icon-right"><i class="fas fa-bars"></i></div>
        </div>
        <img class="header-logo-img" src="images/logo.png" alt="مطعم العم طه" onerror="this.src='https://via.placeholder.com/600x200/5b1416/dab669?text=Uncle+Taha+Restaurant'">
    </div>

    <!-- شريط البحث -->
    <div class="search-wrapper">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="ابحث في قائمة الأصناف...">
            <i class="fas fa-search search-icon"></i>
        </div>
    </div>

    <div class="container">
        <!-- الصفحة الرئيسية -->
        <div id="homePage" class="page active-page">
            <div class="categories-grid" id="categoriesGrid"></div>
        </div>

        <!-- صفحة القائمة -->
        <div id="menuPage" class="page">
            <div class="back-btn" onclick="goBackFromMenu()"><i class="fas fa-arrow-right"></i> رجوع</div>
            <div id="menuContent"></div>
        </div>

        <!-- صفحة الدفع -->
        <div id="checkoutPage" class="page">
            <div class="back-btn" onclick="goBackToMenu()"><i class="fas fa-arrow-right"></i> رجوع</div>
            <h3 style="margin-bottom: 12px; font-weight: 800; color: var(--primary);">🧾 تفاصيل الطلب</h3>
            <div id="checkoutOrderSummary" style="background: #fff; border-radius: 16px; padding: 16px; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.02);"></div>
            <div style="margin-top: 20px;">
                <label style="font-weight:800; font-size:0.85rem; margin-bottom:8px; display:block; color:#333;">📍 عنوان التوصيل</label>
                <button class="checkout-btn" onclick="getCurrentLocationForCheckout()" style="background: var(--primary); color: white; padding: 12px; font-size:0.85rem; margin-bottom: 8px;"><i class="fas fa-location-dot"></i> استخدم موقعي الحالي</button>
                <div onclick="openMapForCheckout()" style="background: #fff; border: 1px solid #eee; border-radius: 30px; padding: 14px 18px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.02);">
                    <span id="checkoutLocationTxt" style="color: #555; font-weight: 700; font-size: 0.85rem;">🗺️ حدد موقعك بدقة من الخريطة</span>
                    <i class="fas fa-map-marker-alt" style="color: var(--primary); font-size: 1.2rem;"></i>
                </div>
                <input type="text" id="checkoutAddressManual" placeholder="أو اكتب عنوانك التفصيلي يدوياً هنا..." style="background: #fff; border: 1px solid #eee; border-radius: 30px; padding: 14px 18px; width: 100%; margin: 8px 0; color: #333; outline: none; font-size: 0.85rem;">
                <div id="deliveryCostDisplay" style="display:none; background: var(--primary); border-radius: 16px; padding: 14px; margin: 12px 0; color: white; font-weight: 700; font-size: 0.9rem; display:flex; justify-content:space-between; align-items:center;"><div>🚚 تكلفة التوصيل التقريبية</div><div><strong id="deliveryCostValue">0</strong> ريال</div></div>
            </div>
            <button class="checkout-btn" onclick="confirmCheckoutOrder()" style="width:100%; padding:15px; background:var(--gold); color:#222; border:none; border-radius:40px; font-weight:900; margin-top:18px; font-size:1.05rem;">✅ تأكيد وإرسال الطلب</button>
        </div>

        <!-- صفحة الطلبات -->
        <div id="ordersPage" class="page">
            <h3 style="margin-bottom: 12px; font-weight: 800; color: var(--primary);">📋 طلباتي السابقة</h3>
            <div id="myOrdersContainer" style="background: #fff; border-radius: 16px; padding: 16px; border: 1px solid #eee;"></div>
        </div>

        <!-- صفحة الإعدادات -->
        <div id="settingsPage" class="page">
            <div style="background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
                <h3 style="margin-bottom: 16px; font-weight: 800; color: var(--primary);">⚙️ إعدادات الحساب</h3>
                <button id="settingsLogoutBtn" style="width:100%; padding:14px; background:#ef4444; color:white; border:none; border-radius:30px; font-weight:800; cursor:pointer; font-size:0.95rem; box-shadow:0 4px 12px rgba(239,68,68,0.3);">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <div class="nav-item" data-page="settingsPage"><span class="nav-icon"><i class="fas fa-cog"></i></span><span>الإعدادات</span></div>
        <div class="nav-item" onclick="toggleCart()"><span class="nav-icon"><i class="fas fa-shopping-cart"></i></span><span>السلة</span><span class="nav-badge" id="navCartBadge" style="display:none;">0</span></div>
        <div class="nav-item" data-page="ordersPage"><span class="nav-icon"><i class="fas fa-clipboard-list"></i></span><span>طلباتي</span></div>
        <div class="nav-item active" data-page="homePage"><span class="nav-icon"><i class="fas fa-home"></i></span><span>الرئيسية</span></div>
    </nav>

    <!-- السلة العائمة والجانبية -->
    <div id="floatCart" class="float-cart" onclick="goToCheckout()"><div><span id="cartCount">0</span> أصناف | <span id="cartTotal">0</span> ريال</div><div>عرض السلة <i class="fas fa-chevron-left"></i></div></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header"><span>🛒 سلة الطلبات</span><span class="cart-close" onclick="toggleCart()">✕</span></div>
        <div class="cart-items" id="cartItemsList"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>الإجمالي الكلي</span><span id="cartTotalPrice">0 ريال</span></div>
            <button class="checkout-btn" onclick="proceedToCheckout()">إتمام الطلب</button>
        </div>
    </div>

    <!-- النافذة المنبثقة للمنتج -->
    <div id="itemModal" class="item-modal-overlay">
        <div class="item-modal-card">
            <div id="modalImg" style="height:190px; display:flex; align-items:center; justify-content:center; font-size:5rem; background:#f8f6f4; width:100%;"></div>
            <div class="modal-content">
                <h3 id="modalTitle"></h3>
                <div id="modalDesc" class="modal-desc"></div>
                <div id="modalPrice" class="modal-price"></div>
                <div class="modal-quantity"><button id="modalMinus">-</button><span id="modalQuantity" style="font-weight:800; font-size:1.1rem;">1</span><button id="modalPlus">+</button></div>
                <div class="modal-note"><textarea id="modalNote" rows="2" placeholder="ملاحظات إضافية على الطلب (اختياري)..."></textarea></div>
                <div class="modal-actions"><button class="btn-add-modal" id="modalAddBtn">➕ أضف للسلة</button><button class="btn-close-modal" id="modalCloseBtn">إلغاء</button></div>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-card">
            <div style="margin-bottom: 22px;"><i class="fas fa-utensils" style="font-size: 2.8rem; color: var(--gold);"></i><h2 style="color: var(--gold); font-weight: 900; margin-top: 8px;">مطعم العم طه</h2></div>
            <div class="role-buttons" style="display: flex; gap: 10px; margin-bottom: 20px; background: rgba(255,255,255,0.06); padding: 5px; border-radius: 40px;">
                <div id="roleCustomer" class="role-btn active">🧑 عميل</div>
                <div id="roleDriver" class="role-btn">🛵 مندوب</div>
            </div>
            <input type="text" id="loginName" class="field-input" placeholder="الاسم الكامل">
            <input type="tel" id="loginPhone" class="field-input" placeholder="رقم الهاتف">
            <div id="passwordField" style="display:none;"><input type="password" id="loginPassword" class="field-input" placeholder="كلمة السر الخاصة بالمندوب"></div>
            <button id="loginBtn">دخول للتطبيق</button>
        </div>
    </div>

    <!-- خريطة التوصيل المنبثقة -->
    <div id="map-overlay">
        <div id="map"></div>
        <div class="map-controls">
            <div class="map-back" onclick="closeMap()" style="flex:1; color:white; padding:14px; text-align:center; font-weight:800; cursor:pointer; border-radius:40px; background:rgba(255,255,255,0.2);">↩️ رجوع</div>
            <div class="map-confirm" onclick="confirmMapLocation()" style="flex:1; color:#222; padding:14px; text-align:center; font-weight:900; cursor:pointer; border-radius:40px; background:var(--gold);">✅ تأكيد هذا الموقع</div>
        </div>
    </div>

    <div id="toastMsg" class="toast"></div>

    <script>
        const PHOTOS = {
            "img_tabaq_asabe": "images/img_tabaq_asabe.jpg",
            "img_shawarma_sarookh_arabi_jobn": "images/img_shawarma_sarookh_arabi_jobn.jpg",
            "img_falafel_cheese": "images/img_falafel_cheese.jpg",
            "img1_shbs_special": "images/img1_shbs_special.jpg",

        function calculateDistance(lat1, lng1, lat2, lng2) { 
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180; 
            const dLng = (lng2 - lng1) * Math.PI / 180; 
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2; 
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
        }

            let roundedPrice = roundToNearestHundred(rawPrice); 
            deliveryCost = Math.max(roundedPrice, MIN_DELIVERY_PRICE);

            document.getElementById('deliveryCostValue').innerText = deliveryCost;

        // دالة تأكيد وإرسال الطلب (تمت إضافتها لحل المشكلة)
        async function confirmCheckoutOrder() {
            if (!currentUser) {
                showToast("⚠️ يرجى تسجيل الدخول أولاً");
                return;
            }
            if (cart.length === 0) {
                showToast("🛒 سلة الطلبات فارغة");
                return;
            }
            let manualAddress = document.getElementById('checkoutAddressManual').value.trim();
            if (!manualAddress && !customerLocation) {
                showToast("📍 يرجى تحديد موقعك على الخريطة أو كتابة العنوان يدوياً");
                return;
            }

            let totalFood = cart.reduce((s, i) => s + (i.p * i.qty), 0);
            let finalTotal = totalFood + deliveryCost;
            let orderId = Date.now().toString().slice(-6);

            let orderData = {
                id: orderId,
                customerName: currentUser.name,
                customerPhone: currentUser.phone,
                items: cart,
                total: finalTotal,
                deliveryCost: deliveryCost,
                address: manualAddress || "موقع محدد عبر الخريطة الجغرافية",
                location: customerLocation || null,
                status: "pending",
                timestamp: Date.now()
            };

            try {
                let btn = event.target;
                btn.disabled = true;
                btn.innerText = "جاري إرسال الطلب...";

                await fetch(`${FIREBASE_URL}/orders/${orderId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(orderData)
                });

                showToast("🎉 تم إرسال طلبك بنجاح!");
                cart = [];
                updateCartDisplay();
                showPage('ordersPage');
                btn.disabled = false;
                btn.innerText = "✅ تأكيد وإرسال الطلب";
            } catch (err) {
                showToast("❌ حدث خطأ أثناء إرسال الطلب، تحقق من الاتصال");
                let btn = event.target;
                btn.disabled = false;
                btn.innerText = "✅ تأكيد وإرسال الطلب";
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            let activeNav = document.querySelector(`.nav-item[data-page="${pageId}"]`);
            if (activeNav) activeNav.classList.add('active');
            if (pageId === 'ordersPage' && currentUser) renderMyOrders();
        }

        document.querySelectorAll('.nav-item[data-page]').forEach(n => {
            n.addEventListener('click', function() { showPage(this.dataset.page); });
        });

        const safeStorage = {
            get(key) { try { return localStorage.getItem(key); } catch(e) { return null; } },
            set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} },
            remove(key) { try { localStorage.removeItem(key); } catch(e) {} }
        };

        document.getElementById('settingsLogoutBtn').addEventListener('click', function() { 
            if(confirm('هل أنت متأكد من تسجيل الخروج؟')) { 
                safeStorage.remove('waselny_user'); 
                location.reload(); 
            } 
        });

        let savedUser = safeStorage.get('waselny_user');
        if (savedUser) { 
            try { 
                currentUser = JSON.parse(savedUser); 
                document.getElementById('loginOverlay').style.display = 'none'; 
                showPage('homePage'); 
            } catch(e) { initLogin(); } 
        } else { initLogin(); }

        renderCategories();

        function initLogin() {
            const roleCustomer = document.getElementById('roleCustomer'); 
            const roleDriver = document.getElementById('roleDriver'); 
            const passwordField = document.getElementById('passwordField'); 
            const loginBtn = document.getElementById('loginBtn');
            
            roleCustomer.onclick = function() { roleCustomer.classList.add('active'); roleDriver.classList.remove('active'); passwordField.style.display = 'none'; };
            roleDriver.onclick = function() { roleDriver.classList.add('active'); roleCustomer.classList.remove('active'); passwordField.style.display = 'block'; };
            
            loginBtn.onclick = async function() {
                let isDriver = roleDriver.classList.contains('active'); 
                let name = document.getElementById('loginName').value.trim(); 
                let phone = document.getElementById('loginPhone').value.trim(); 
                let password = document.getElementById('loginPassword').value.trim();
                
                if (!name || !phone) return showToast('يرجى إدخال الاسم ورقم الهاتف بشكل صحيح');
                if (isDriver && password !== DRIVER_PASSWORD) return showToast('❌ كلمة السر للمندوب غير صحيحة!');
                
                let role = isDriver ? 'driver' : 'customer';
                loginBtn.disabled = true; 
                loginBtn.innerText = '...جاري تسجيل الدخول';
                
                try {
                    await fetch(`${FIREBASE_URL}/users/${phone}.json`, { method: 'PUT', body: JSON.stringify({ phone, name, role, isBusy: false }) });
                } catch(err) {
                    console.log('Local login fallback');
                }
                
                currentUser = { role, phone, name }; 
                safeStorage.set('waselny_user', JSON.stringify(currentUser)); 
                document.getElementById('loginOverlay').style.display = 'none';
                loginBtn.disabled = false; 
                loginBtn.innerText = 'دخول للتطبيق';
                showPage('homePage'); 
                showToast(`أهلاً بك ${name}`);
            };
        }

        async function renderMyOrders() {
            if (!currentUser) return;
            try {
                let res = await fetch(`${FIREBASE_URL}/orders.json`); 
                let data = await res.json(); 
                allOrders = data ? Object.values(data).sort((a, b) => b.id - a.id) : [];
                let myOrders = allOrders.filter(o => o.customerPhone === currentUser?.phone);
                document.getElementById('myOrdersContainer').innerHTML = myOrders.length === 0 ? 
                    `<p style="text-align:center; padding:30px; color:#888;">لا توجد طلبات سابقة مسجلة</p>` : 
                    myOrders.map(o => `
                        <div style="background:#f8f6f4; padding:14px; border-radius:12px; border:1px solid #eee; margin-bottom:12px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-weight:900; color:var(--primary);">طلب #${o.id}</span>
                                <span style="background:var(--primary); color:white; padding:3px 12px; border-radius:20px; font-size:0.75rem; font-weight:700;">${getStatusText(o.status)}</span>
                            </div>
                            <div style="margin-top:8px; font-size:0.85rem; color:#444; font-weight:700;">المبلغ الإجمالي: ${o.total} ريال</div>
                        </div>`).join('');
            } catch(e) {
                document.getElementById('myOrdersContainer').innerHTML = `<p style="text-align:center; padding:20px; color:#888;">تعذر جلب الطلبات، تحقق من الاتصال</p>`;
            }
        }
        
        function getStatusText(st) { 
            const m = { pending: 'قيد المراجعة', on_the_way: 'في الطريق إليك', arrived: 'وصل المندوب للموقع', delivered: 'تم التوصيل بنجاح' }; 
            return m[st] || st; 
        }
    </script>
</body>
</html>
