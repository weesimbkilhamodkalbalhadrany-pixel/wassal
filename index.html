<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>مطاعم وبروست الاندلس | التوصيل الذكي - مناديب</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #faf6ee; color: #241a17; direction: rtl; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
.vpn-container {
max-width: 420px;
margin: auto;
padding: 24px;
text-align: center;
width: 100%;
}
.brand-header {
margin-bottom: 30px;
}
.brand-logo {
width: 80px;
height: 80px;
background: linear-gradient(135deg, #a3213c, #4a0c1a);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
margin: 0 auto 12px;
color: #e6c579;
font-size: 2rem;
box-shadow: 0 10px 25px rgba(124,19,41,0.25);
border: 2px solid #e6c579;
}
.brand-title {
font-size: 1.4rem;
font-weight: 900;
color: #7c1329;
}
.brand-subtitle {
font-size: 0.8rem;
color: #7a716d;
margin-top: 4px;
font-weight: 600;
}
/* زر VPN Style */
.vpn-power-section {
background: #fffdfa;
border-radius: 36px;
padding: 40px 20px;
box-shadow: 0 20px 40px rgba(76,12,26,0.12);
border: 1px solid #ece2d3;
margin-bottom: 24px;
position: relative;
overflow: hidden;
}
.vpn-btn {
width: 140px;
height: 140px;
border-radius: 50%;
background: linear-gradient(145deg, #e0453f, #a3213c);
border: none;
color: white;
font-size: 3rem;
cursor: pointer;
box-shadow: 0 12px 30px rgba(224,69,63,0.4);
transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
display: flex;
align-items: center;
justify-content: center;
margin: 0 auto 20px;
outline: none;
position: relative;
}
.vpn-btn:active {
transform: scale(0.92);
}
.vpn-btn.active {
background: linear-gradient(145deg, #16966a, #10704f);
box-shadow: 0 0 0 12px rgba(22,150,106,0.15), 0 12px 30px rgba(22,150,106,0.4);
animation: pulseVpn 2s infinite;
}
@keyframes pulseVpn {
0% { box-shadow: 0 0 0 0 rgba(22,150,106,0.4), 0 12px 30px rgba(22,150,106,0.4); }
70% { box-shadow: 0 0 0 24px rgba(22,150,106,0), 0 12px 30px rgba(22,150,106,0.4); }
100% { box-shadow: 0 0 0 0 rgba(22,150,106,0), 0 12px 30px rgba(22,150,106,0.4); }
}
.vpn-status-text {
font-size: 1.1rem;
font-weight: 900;
color: #241a17;
margin-bottom: 6px;
}
.vpn-status-sub {
font-size: 0.75rem;
color: #7a716d;
font-weight: 600;
}
.driver-info-card {
background: #fffdfa;
border-radius: 24px;
padding: 16px 20px;
border: 1px solid #ece2d3;
box-shadow: 0 4px 14px rgba(76,12,26,0.06);
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 20px;
}
.driver-name-disp {
font-weight: 800;
font-size: 0.95rem;
color: #7c1329;
text-align: right;
}
.driver-phone-disp {
font-size: 0.75rem;
color: #7a716d;
font-weight: 600;
text-align: right;
}
.logout-link {
background: transparent;
border: none;
color: #e0453f;
font-weight: 800;
font-size: 0.85rem;
cursor: pointer;
padding: 8px 16px;
border-radius: 20px;
}
/* شاشة الدخول البسيطة */
#loginOverlay {
position: fixed;
inset: 0;
background: linear-gradient(160deg, #2c0710, #4a0c1a);
z-index: 9999;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}
.login-card {
background: rgba(255,255,255,0.08);
backdrop-filter: blur(20px);
border-radius: 32px;
padding: 36px 24px;
width: 100%;
max-width: 360px;
border: 1px solid rgba(255,255,255,0.15);
text-align: center;
color: white;
}
.field-input {
width: 100%;
padding: 14px 20px;
border-radius: 30px;
border: 1.5px solid rgba(255,255,255,0.15);
background: rgba(255,255,255,0.08);
color: white;
font-size: 0.85rem;
outline: none;
margin-bottom: 12px;
text-align: right;
}
.field-input::placeholder { color: rgba(255,255,255,0.5); }
.login-btn {
width: 100%;
padding: 15px;
border-radius: 30px;
border: none;
background: linear-gradient(135deg, #e6c579, #93701f);
color: #2c0710;
font-weight: 900;
font-size: 0.95rem;
cursor: pointer;
margin-top: 10px;
}
.toast {
position: fixed;
bottom: 30px;
left: 20px;
right: 20px;
background: #2c0710;
color: white;
padding: 12px;
border-radius: 30px;
text-align: center;
z-index: 10000;
display: none;
font-size: 0.82rem;
font-weight: 700;
border: 1px solid rgba(230,197,121,0.3);
max-width: 400px;
margin: 0 auto;
}
.toast.show { display: block; }
</style>
</head>
<body>
<div id="toastMsg" class="toast"></div>
<!-- نافذة تسجيل الدخول للمندوب -->
<div id="loginOverlay">
<div class="login-card">
<div class="brand-logo"><i class="fas fa-motorcycle"></i></div>
<h2 style="font-size: 1.25rem; font-weight: 900; margin-bottom: 4px; color: #e6c579;">توصيل الأندلس</h2>
<p style="font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-bottom: 24px;">تسجيل دخول المندوب</p>
<input type="text" id="driverNameInput" class="field-input" placeholder="اسم المندوب الكريم">
<input type="tel" id="driverPhoneInput" class="field-input" placeholder="رقم الهاتف">
<button class="login-btn" onclick="loginDriver()">بدء العمل 🛵</button>
</div>
</div>
<!-- الواجهة الرئيسية على شكل زر VPN -->
<div class="vpn-container">
<div class="brand-header">
<div class="brand-logo"><i class="fas fa-motorcycle"></i></div>
<h1 class="brand-title">مطاعم وبروست الاندلس</h1>
<p class="brand-subtitle">نظام تتبع المناديب الفوري</p>
</div>
<div class="driver-info-card">
<div>
<div class="driver-name-disp" id="dispDriverName">المندوب</div>
<div class="driver-phone-disp" id="dispDriverPhone">--</div>
</div>
<button class="logout-link" onclick="logoutDriver()">خروج</button>
</div>
<div class="vpn-power-section">
<button class="vpn-btn" id="vpnBtn" onclick="toggleVpnStatus()">
<i class="fas fa-power-off" id="vpnIcon"></i>
</button>
<div class="vpn-status-text" id="vpnStatusTitle">غير متصل بالخدمة</div>
<div class="vpn-status-sub" id="vpnStatusSub">اضغط للاتصال ومشاركة موقعك مع الإدارة</div>
</div>
<div style="font-size: 0.72rem; color: #7a716d; font-weight: 600;">
<i class="fas fa-shield-alt" style="color: #16966a;"></i> يتم إرسال موقعك بدقة أثناء تفعيل الاتصال لتسهيل توجيه الطلبات إليك.
</div>
</div>
<script>
const FIREBASE_URL = "https://waselny-2812b-default-rtdb.firebaseio.com";
let currentDriver = null;
let isConnected = false;
let locationWatchId = null;
function showToast(msg) {
let t = document.getElementById('toastMsg');
t.innerText = msg; t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2500);
}
function loginDriver() {
let name = document.getElementById('driverNameInput').value.trim();
let phone = document.getElementById('driverPhoneInput').value.trim();
if (!name || !phone) {
showToast('الرجاء إدخال الاسم ورقم الهاتف');
return;
}
currentDriver = { name, phone, id: 'driver_' + Date.now() };
localStorage.setItem('andalus_driver', JSON.stringify(currentDriver));
document.getElementById('dispDriverName').innerText = currentDriver.name;
document.getElementById('dispDriverPhone').innerText = currentDriver.phone;
document.getElementById('loginOverlay').style.display = 'none';
showToast('مرحباً بك يا ' + name);
}
function logoutDriver() {
stopLocationSharing();
localStorage.removeItem('andalus_driver');
currentDriver = null;
document.getElementById('loginOverlay').style.display = 'flex';
}
function toggleVpnStatus() {
if (!isConnected) {
// طلب السماح بالموقع وتفعيل الاتصال
if (navigator.geolocation) {
showToast('جاري طلب إذن الوصول للموقع...');
navigator.geolocation.getCurrentPosition(
(pos) => {
isConnected = true;
updateVpnUI(true);
startLocationSharing();
showToast('تم الاتصال بنجاح ومشاركة الموقع مع الإدارة');
sendLocationToServer(pos.coords.latitude, pos.coords.longitude);
},
(err) => {
alert('الرجاء السماح بالوصول إلى الموقع (Location Permission) لكي تتمكن من تفعيل الخدمة.');
showToast('فشل الحصول على الموقع');
},
{ enableHighAccuracy: true, timeout: 10000 }
);
} else {
alert('متصفحك لا يدعم خدمات تحديد الموقع الجغرافي');
}
} else {
isConnected = false;
updateVpnUI(false);
stopLocationSharing();
showToast('تم قطع الاتصال وإيقاف مشاركة الموقع');
sendOfflineStatusToServer();
}
}
function updateVpnUI(active) {
let btn = document.getElementById('vpnBtn');
let icon = document.getElementById('vpnIcon');
let title = document.getElementById('vpnStatusTitle');
let sub = document.getElementById('vpnStatusSub');
if (active) {
btn.classList.add('active');
icon.className = 'fas fa-satellite-dish';
title.innerText = 'متصل وينقل الموقع';
sub.innerText = 'موقعك الآن مرئي ومحدث لدى الإدارة';
} else {
btn.classList.remove('active');
icon.className = 'fas fa-power-off';
title.innerText = 'غير متصل بالخدمة';
sub.innerText = 'اضغط للاتصال ومشاركة موقعك مع الإدارة';
}
}
function startLocationSharing() {
if (navigator.geolocation && !locationWatchId) {
locationWatchId = navigator.geolocation.watchPosition(
(pos) => {
sendLocationToServer(pos.coords.latitude, pos.coords.longitude);
},
(err) => { console.error(err); },
{ enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
);
}
}
function stopLocationSharing() {
if (locationWatchId !== null) {
navigator.geolocation.clearWatch(locationWatchId);
locationWatchId = null;
}
}
async function sendLocationToServer(lat, lng) {
if (!currentDriver) return;
try {
let payload = {
name: currentDriver.name,
phone: currentDriver.phone,
lat: lat,
lng: lng,
status: 'online',
lastUpdated: Date.now()
};
await fetch(${FIREBASE_URL}/drivers_live/${currentDriver.phone}.json, {
method: 'PUT',
body: JSON.stringify(payload)
});
} catch(e) { console.error(e); }
}
async function sendOfflineStatusToServer() {
if (!currentDriver) return;
try {
await fetch(${FIREBASE_URL}/drivers_live/${currentDriver.phone}.json, {
method: 'PATCH',
body: JSON.stringify({ status: 'offline', lastUpdated: Date.now() })
});
} catch(e) { console.error(e); }
}
window.onload = function() {
let saved = localStorage.getItem('andalus_driver');
if (saved) {
try {
currentDriver = JSON.parse(saved);
document.getElementById('dispDriverName').innerText = currentDriver.name;
document.getElementById('dispDriverPhone').innerText = currentDriver.phone;
document.getElementById('loginOverlay').style.display = 'none';
} catch(e) { localStorage.removeItem('andalus_driver'); }
}
};
</script>
</body>
</html>
