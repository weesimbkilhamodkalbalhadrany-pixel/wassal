<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>مطعم العم طه | التوصيل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* ===== إعدادات أساسية ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f8f6f4; color: #1e1817; direction: rtl; padding-bottom: 80px; }
        :root { 
            --primary: #6f1a2d; /* لون المطعم العنابي الغامق المطابق للصورة */
            --gold: #dab669;   /* اللون الذهبي للشعار والنصوص */
            --light-grey: #f2f2f2;
        }
        
        /* ===== الهيدر (شعار احترافي متطابق تمامًا مع لون الخلفية) ===== */
        .header { position: relative; background: #5b1416; box-shadow: 0 6px 16px rgba(0,0,0,0.25); overflow: hidden; }
        .header-logo-img { width: 100%; display: block; object-fit: cover; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 18px; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 100%); pointer-events: none; }

        /* الأيقونات العلوية */
        .header-top { position: absolute; top: 0; left: 0; right: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 18px; z-index: 5; }
        .header-icon-left { color: var(--gold); font-size: 1.4rem; cursor: pointer; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
        .header-icon-right { color: #fff; font-size: 1.4rem; cursor: pointer; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }

        /* ===== شريط البحث ===== */
        .search-wrapper { padding: 0 16px; margin-top: -16px; position: relative; z-index: 10; }
        .search-container { background: var(--light-grey); border-radius: 30px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
        .search-container input { border: none; background: transparent; flex: 1; padding: 6px; font-size: 0.85rem; color: #333; width: 100%; text-align: right; outline: none; }
        .search-container input::placeholder { color: #999; font-weight: 500; }
        .search-icon { color: var(--gold); font-size: 1.1rem; margin-right: 8px; }

        /* ===== حاوية التطبيق ===== */
        .container { padding: 16px 14px 80px; max-width: 600px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.3s ease-out; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== بطاقات الأقسام (تصميم مضغوط بدون فراغات) ===== */
        .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
        .category-card { background: linear-gradient(155deg, var(--primary), #4a0f1c); border-radius: 14px; padding: 16px 8px; text-align: center; cursor: pointer; transition: transform 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 10px rgba(111, 26, 45, 0.2); min-height: 128px; position: relative; }
        .category-card:active { transform: scale(0.96); }
        .category-title { color: var(--gold); font-weight: 700; font-size: 0.95rem; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .category-img { font-size: 2.3rem; line-height: 1; }
        .order-btn { border: 1.5px solid var(--gold); background: transparent; border-radius: 30px; padding: 4px 18px; color: var(--gold); font-weight: 600; font-size: 0.68rem; cursor: pointer; transition: all 0.2s; }
        .order-btn:active { background: var(--gold); color: var(--primary); }

        /* ===== واجهات الصفحات الداخلية (قائمة الأصناف - عرض قائمة نظيف) ===== */
        .back-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff; padding: 8px 16px; border-radius: 30px; margin-bottom: 14px; cursor: pointer; font-size: 0.8rem; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eee; color: var(--primary); }
        .menu-list { display: flex; flex-direction: column; gap: 10px; }
        .menu-item-row { background: #fff; border-radius: 16px; border: 1px solid #eee; display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
        .menu-item-row:active { background: #fbf9f7; }
        .menu-item-icon { width: 50px; height: 50px; min-width: 50px; border-radius: 12px; background: #f8f6f4; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
        .menu-item-info { flex: 1; text-align: right; min-width: 0; }
        .menu-item-name { font-weight: 800; font-size: 0.85rem; color: #222; line-height: 1.3; }
        .menu-item-desc { font-size: 0.68rem; color: #888; line-height: 1.4; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-item-price { color: var(--primary); font-weight: 800; font-size: 0.8rem; margin-top: 3px; }
        .menu-item-add-btn { min-width: 34px; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--gold); border: none; font-size: 1.2rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .menu-item-add-btn:active { transform: scale(0.9); }
        .section-title { font-weight: 800; font-size: 0.95rem; color: var(--primary); margin: 4px 2px 10px; }
        
        /* ===== شريط التنقل السفلي ===== */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; padding: 6px 0 14px; border-top: 1px solid rgba(0,0,0,0.04); box-shadow: 0 -2px 12px rgba(0,0,0,0.03); z-index: 100; }
        .nav-item { text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #888; font-size: 0.6rem; font-weight: 500; padding: 4px 8px; min-width: 45px; }
        .nav-item .nav-icon { font-size: 1.4rem; margin-bottom: 2px; color: #888; transition: color 0.2s; }
        .nav-item.active .nav-icon { color: var(--gold); }
        .nav-item.active { color: #333; font-weight: 700; }
        .nav-badge { position: absolute; top: -4px; right: 4px; background: #ef4444; color: white; font-size: 0.5rem; padding: 2px 6px; border-radius: 50%; border: 2px solid white; }

        /* ===== (أنماط CSS المتبقية للعربة والسلة والتسجيل) ===== */
        .float-cart { position: fixed; bottom: 80px; left: 16px; right: 16px; background: var(--primary); color: white; padding: 12px 20px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; z-index: 100; display: none; box-shadow: 0 4px 12px rgba(111, 26, 45, 0.3); border: 1px solid var(--gold); font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .cart-sidebar { position: fixed; top: 0; left: -100%; width: 85%; max-width: 380px; height: 100%; background: #ffffff; z-index: 10001; transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .cart-sidebar.open { left: 0; }
        .cart-header { padding: 16px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 1rem; }
        .cart-close { cursor: pointer; font-size: 1.2rem; }
        .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
        .cart-item { display: flex; gap: 12px; padding: 12px; background: #f8f6f4; border-radius: 16px; margin-bottom: 12px; align-items: center; border: 1px solid #eaeaea; }
        .cart-item-img { width: 50px; height: 50px; border-radius: 8px; background-size: cover; }
        .cart-item-details { flex: 1; }
        .cart-item-details h4 { font-size: 0.85rem; font-weight: 800; color: #222; }
        .cart-item-details div { font-size: 0.75rem; color: var(--primary); font-weight: 700; margin-top: 2px; }
        .cart-qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn-small { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); border: none; color: white; font-weight: bold; cursor: pointer; }
        .cart-footer { padding: 16px; border-top: 1px solid #eee; background: #fff; }
        .cart-total { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 12px; font-size: 0.95rem; }
        .checkout-btn { width: 100%; padding: 14px; background: var(--gold); color: #222; border: none; border-radius: 40px; font-weight: 800; cursor: pointer; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(218, 182, 105, 0.2); }
        
        .item-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 20000; display: none; align-items: center; justify-content: center; }
        .item-modal-card { background: #fff; border-radius: 24px; width: 90%; max-width: 400px; overflow: hidden; animation: modalPop 0.2s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-img { width: 100%; height: 210px; object-fit: contain; display: block; background: #f2f0ee; }
        .modal-content { padding: 20px; }
        .modal-content h3 { font-size: 1.2rem; margin-bottom: 6px; color: #222; }
        .modal-desc { font-size: 0.8rem; color: #888; margin-bottom: 12px; line-height: 1.4; }
        .modal-price { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 15px; }
        .modal-quantity { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 16px; background: #f8f6f4; padding: 8px; border-radius: 40px; }
        .modal-quantity button { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 1.2rem; font-weight: 800; cursor: pointer; }
        .modal-note textarea { width: 100%; padding: 10px; border-radius: 16px; border: 1px solid #ddd; font-size: 0.8rem; resize: vertical; outline: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .modal-actions button { flex: 1; padding: 14px; border-radius: 40px; font-weight: 800; border: none; cursor: pointer; font-size: 0.9rem; }
        .btn-add-modal { background: var(--gold); color: #222; }
        .btn-close-modal { background: #eee; color: #333; }

        .toast { position: fixed; bottom: 90px; left: 20px; right: 20px; background: #222; color: white; padding: 14px; border-radius: 30px; text-align: center; z-index: 9999; display: none; font-size: 0.85rem; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .toast.show { display: block; animation: slideUp 0.3s forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); z-index:100000; display:flex; align-items:center; justify-content:center; }
        .login-card { background:rgba(255,255,255,0.08); backdrop-filter:blur(20px); border-radius:40px; padding:32px 24px; width:90%; max-width:360px; box-shadow:0 20px 40px rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); text-align:center; color:white; }
        .role-btn { flex:1; padding:12px 8px; border-radius:40px; font-weight:700; cursor:pointer; font-size:0.85rem; transition:all 0.3s; background:transparent; color:rgba(255,255,255,0.7); }
        .role-btn.active { background:#fff; color:var(--primary); box-shadow:0 5px 15px rgba(0,0,0,0.1); }
        #loginBtn { width:100%; margin-top:24px; padding:14px; border-radius:40px; border:none; background:var(--gold); color:#222; font-weight:800; font-size:1rem; cursor:pointer; box-shadow:0 4px 12px rgba(218,182,105,0.4); }
        .field-input { width:100%; padding:14px 20px; border-radius:40px; border:none; background:rgba(255,255,255,0.15); color:white; font-size:0.85rem; outline:none; margin-bottom:12px; }
    </style>
</head>
